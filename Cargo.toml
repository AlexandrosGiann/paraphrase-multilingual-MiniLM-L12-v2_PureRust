[package]
name = "minilm"
version = "0.1.0"
edition = "2021"
description = "paraphrase-multilingual-MiniLM-L12-v2 (q8) sentence embeddings in pure Rust, bit-for-bit identical to Transformers.js (WASM)"
publish = false

# No dependencies: only the Rust standard library.
[dependencies]

[lib]
name = "minilm"
path = "src/lib.rs"

[[bin]]
name = "minilm"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

# the tests run the whole model; keep them fast
[profile.test]
opt-level = 3
